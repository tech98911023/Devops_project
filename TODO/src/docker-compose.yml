version: "3.9"

services:
  backend:
    build: ./backend
    container_name: flask-backend
    ports:
      - "5000:5000"
    networks:
      - todo-network

  frontend:
    build: ./frontend
    container_name: react-frontend
    networks:
      - todo-network
    ports:
      - "3000:5173"
    depends_on:
      - backend
networks:
  todo-network:
    driver: bridge
